name: build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libwings-dev libgweather-4-dev libgeoclue-2-dev
      - name: Build
        run: |
          ./autogen.sh
          ./configure
          make distcheck
